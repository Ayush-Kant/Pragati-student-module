version: "3.9"

services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: pragati_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pragati}
      POSTGRES_USER: ${POSTGRES_USER:-pragati_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-run migrations on first start
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pragati_user} -d ${POSTGRES_DB:-pragati}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: pragati_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      POSTGRESQL_URI: postgresql://${POSTGRES_USER:-pragati_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-pragati}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      USE_MOCK_DATA: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pragati_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://backend:5000

volumes:
  pgdata:
    name: pragati_pgdata
